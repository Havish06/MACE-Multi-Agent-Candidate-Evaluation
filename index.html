    <!-- JSON-LD Structured Data (Schema.org WebApplication + FAQPage + SoftwareSourceCode) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "#mace-app",
          "name": "MACE - Multi-Agent Committee Evaluator",
          "url": "/",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "An explainable multi-agent AI hiring evaluation and adversarial adjudication platform powered by Google Gemini 3.7 Flash. Coordinates four specialist personas through dialectical debate, evidence verification, and non-averaging adjudication.",
          "browserRequirements": "Requires JavaScript. Requires HTML5.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Independent 4-Persona Deliberation (Technical Architect, Culture Lead, Hiring Manager, Risk Auditor)",
            "Cross-Document Contradiction Analysis linking Resumes to Transcripts",
            "Multi-Turn Turn-Based Adversarial Voice Debate with Audio Synthesis",
            "Evidence-Weighted Non-Averaging Adjudication Engine",
            "Full Keyboard Accessibility and WCAG AA Screen Reader Compatibility"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "#mace-faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is MACE (Multi-Agent Committee Evaluator)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MACE (Multi-Agent Committee Evaluator) is an explainable AI hiring evaluation system. Rather than relying on a single prompt or opaque score, MACE coordinates four isolated specialist AI agents—Technical Architect, Culture & Behavioral Lead, Hiring Manager Lead, and Risk Auditor—who independently review candidate records, detect factual discrepancies, engage in dialectical debate, and generate an evidence-backed adjudication dossier."
              }
            },
            {
              "@type": "Question",
              "name": "How does multi-agent candidate evaluation prevent hiring bias and groupthink?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MACE prevents groupthink by running the first evaluation pass in complete isolation: each AI agent evaluates the candidate against their domain rubric without seeing peer evaluations. Disagreements and variance across agent scores are mathematically detected, triggering a structured multi-turn debate where agents challenge unsubstantiated claims."
              }
            },
            {
              "@type": "Question",
              "name": "How does the evidence-weighted adjudication engine work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The MACE Adjudicator does not compute a naive mathematical average of scores. Instead, it weights each agent's argument based on ground-truth document citations (evidence strength, contradiction severity, and verified credentials) to reach a decisive, explainable hiring verdict (Strong Hire, Lean Hire, Lean No Hire, Strong No Hire)."
              }
            },
            {
              "@type": "Question",
              "name": "How does MACE detect contradictions between resumes and official records?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MACE performs automated cross-document verification by extracting atomic claims from self-reported resumes and cross-referencing them against official university transcripts and job descriptions, assigning verifiable citation IDs (e.g., E001, E002) and severity levels to any discrepancies."
              }
            },
            {
              "@type": "Question",
              "name": "What AI agent personas are included in the hiring committee?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The committee consists of four specialist personas: 1) Technical Architect (evaluates system design, algorithms, architecture depth), 2) Culture & Behavioral Lead (evaluates collaboration, humility, leadership, communication), 3) Hiring Manager Lead (evaluates commercial execution, velocity, business impact), and 4) Risk Auditor (audits resume discrepancies, tenure gaps, over-claimed achievements)."
              }
            }
          ]
        }
      ]
    }
    </script>
